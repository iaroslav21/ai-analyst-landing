<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plată — AI Analyst</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
    .box{max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem}
  </style>
</head>
<body>
  <div class="box">
    <div class="checkout-success-icon" id="icon">✓</div>
    <h1 id="title">Plată reușită</h1>
    <p id="msg" style="color:var(--muted);margin:1rem 0"></p>
    <a href="index.html" class="btn-primary" style="display:inline-block;margin-top:1rem">Înapoi la site</a>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const status = q.get("status");
    const order = q.get("order") || "";
    if (status === "success") {
      document.getElementById("msg").textContent = order ? "Comandă " + order + " confirmată." : "Abonament activat.";
    } else {
      document.getElementById("icon").textContent = "✕";
      document.getElementById("icon").style.color = "var(--red)";
      document.getElementById("title").textContent = "Plată eșuată";
      document.getElementById("msg").textContent = "Încearcă din nou sau contactează-ne.";
    }
  </script>
</body>
</html>
